name: Build Unsigned IPA

on:
  workflow_dispatch:

jobs:
  unsigned-ipa:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Prebuild native iOS project
        run: npx expo prebuild --platform ios --non-interactive --clean

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Detect Xcode project
        id: xcode
        run: |
          set -e
          WORKSPACE="$(find ios -maxdepth 1 -name '*.xcworkspace' | head -n 1)"
          PROJECT="$(find ios -maxdepth 1 -name '*.xcodeproj' | head -n 1)"

          if [ -n "$WORKSPACE" ]; then
            echo "mode=workspace" >> "$GITHUB_OUTPUT"
            echo "path=$WORKSPACE" >> "$GITHUB_OUTPUT"
            LIST_JSON="$(xcodebuild -workspace "$WORKSPACE" -list -json)"
          elif [ -n "$PROJECT" ]; then
            echo "mode=project" >> "$GITHUB_OUTPUT"
            echo "path=$PROJECT" >> "$GITHUB_OUTPUT"
            LIST_JSON="$(xcodebuild -project "$PROJECT" -list -json)"
          else
            echo "No Xcode workspace or project found in ios/"
            exit 1
          fi

          SCHEME="$(ruby -rjson -e 'data=JSON.parse(STDIN.read); root=data["workspace"] || data["project"]; puts((root["schemes"] || root["targets"]).find { |s| !s.start_with?("Pods-") })' <<< "$LIST_JSON")"
          if [ -z "$SCHEME" ]; then
            echo "Could not detect scheme"
            echo "$LIST_JSON"
            exit 1
          fi
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "Detected scheme: $SCHEME"

      - name: Build unsigned archive
        run: |
          set -e
          if [ "${{ steps.xcode.outputs.mode }}" = "workspace" ]; then
            xcodebuild archive \
              -workspace "${{ steps.xcode.outputs.path }}" \
              -scheme "${{ steps.xcode.outputs.scheme }}" \
              -configuration Release \
              -sdk iphoneos \
              -archivePath build/CinemaEmpireTycoon.xcarchive \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              DEVELOPMENT_TEAM="" \
              PROVISIONING_PROFILE_SPECIFIER=""
          else
            xcodebuild archive \
              -project "${{ steps.xcode.outputs.path }}" \
              -scheme "${{ steps.xcode.outputs.scheme }}" \
              -configuration Release \
              -sdk iphoneos \
              -archivePath build/CinemaEmpireTycoon.xcarchive \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              DEVELOPMENT_TEAM="" \
              PROVISIONING_PROFILE_SPECIFIER=""
          fi

      - name: Make unsigned IPA
        run: |
          set -e
          mkdir -p Payload
          cp -R build/CinemaEmpireTycoon.xcarchive/Products/Applications/*.app Payload/
          /usr/bin/zip -r CinemaEmpireTycoon-unsigned.ipa Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: CinemaEmpireTycoon-unsigned-ipa
          path: CinemaEmpireTycoon-unsigned.ipa
