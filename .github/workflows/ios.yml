name: Build iOS IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List schemes
        run: |
          xcodebuild \
            -project CinemaEmpireTycoon/CinemaEmpireTycoon.xcodeproj \
            -list

      - name: Build unsigned archive
        run: |
          xcodebuild \
            -project CinemaEmpireTycoon/CinemaEmpireTycoon.xcodeproj \
            -scheme CinemaEmpireTycoon \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/CinemaEmpireTycoon.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Make unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/CinemaEmpireTycoon.xcarchive/Products/Applications/*.app Payload/
          zip -r CinemaEmpireTycoon-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CinemaEmpireTycoon-unsigned-ipa
          path: CinemaEmpireTycoon-unsigned.ipa
